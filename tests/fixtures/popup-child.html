<!-- BlackGlass fixture: popup-child
     The window popup.html tries to open. It makes itself unmistakable in three ways, so
     the round trip is observable no matter which channels are blocked:
       1. a full-viewport lime background — visible in any raw frame,
       2. document.title = "BG popup-child", visible on the wire as a title event,
       3. postMessage back to the opener with targetOrigin "*".
     Self-contained, file:// safe. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BG popup-child</title>
<style>
/* ---------- shared fixture chrome (identical in every fixture) ---------- */
:root{color-scheme:dark}
html,body{margin:0;padding:0;background:#00c000;color:#001000;
  font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:none}
#bg-beacon,#bg-status,.bg-corner{position:fixed;width:24px;height:24px;z-index:2147483647}
#bg-beacon{left:0;top:0;background:#ff00ff}
#bg-status{left:24px;top:0;background:#333}
.bg-tr{right:0;top:0;background:#ff8000}
.bg-bl{left:0;bottom:0;background:#0080ff}
.bg-br{right:0;bottom:0;background:#ffff00}
h1{position:fixed;left:56px;top:1px;margin:0;font:600 13px/24px ui-monospace,Menlo,monospace;color:#003000}
#bg-readout{position:fixed;right:8px;bottom:32px;width:380px;max-height:280px;overflow:hidden;
  margin:0;padding:4px;background:rgba(0,0,0,.66);white-space:pre-wrap;word-break:break-all;
  font-size:11px;line-height:1.3;color:#9adcff;pointer-events:none;z-index:2147483646}
/* ---------- fixture-specific ---------- */
#big{position:absolute;left:40px;top:120px;font:700 40px/1.2 ui-monospace,Menlo,monospace;color:#002000}
#meta{position:absolute;left:40px;top:200px;font-size:13px;color:#003000;white-space:pre-wrap}
button{position:absolute;left:40px;top:320px;height:32px;background:#003000;color:#cfc;
  border:1px solid #005000;font:12px ui-monospace,Menlo,monospace;cursor:pointer}
</style>

<body>
<div id="bg-beacon"></div><div id="bg-status"></div>
<div class="bg-corner bg-tr"></div><div class="bg-corner bg-bl"></div><div class="bg-corner bg-br"></div>
<h1>fixture: popup-child</h1>
<pre id="bg-readout"></pre>

<div id="big">POPUP CHILD</div>
<div id="meta"></div>
<button id="closeMe">window.close() self</button>

<script>
/* ---------- shared fixture harness (identical in every fixture except `id`) ---------- */
var __q = new URLSearchParams(location.search);
window.__bg = {
  id: 'popup-child', proto: 1, ready: false, pass: null,
  query: Object.fromEntries(__q),
  markers: {beacon:[12,12], status:[36,12], topRight:[-12,12], bottomLeft:[12,-12], bottomRight:[-12,-12]},
  markerColors: {beaconLoading:'#ff00ff', beaconReady:'#00ffff', statusIdle:'#333333',
                 statusPass:'#00ff00', statusFail:'#ff0000',
                 topRight:'#ff8000', bottomLeft:'#0080ff', bottomRight:'#ffff00'},
  expect: {}, state: function(){ return {}; },
  _ready: function(){ this.ready = true;
    document.getElementById('bg-beacon').style.background = '#00ffff';
    document.documentElement.setAttribute('data-bg-ready','1'); this._dump(); },
  _status: function(v){ this.pass = v;
    document.getElementById('bg-status').style.background =
      v === true ? '#00ff00' : v === false ? '#ff0000' : '#333'; },
  _dump: function(){ var el = document.getElementById('bg-readout');
    if (el) el.textContent = JSON.stringify(this.state(), null, 1); }
};
</script>

<script>
(function () {
  var bg = window.__bg;

  bg.expect = {
    background: '#00c000 over the whole viewport — the loudest possible frame signal',
    title: 'BG popup-child',
    postsBack: '{bg:"popup-child", ok:true, via:<query.via>}',
    passWhen: 'the document loaded at all; the parent decides what that means'
  };

  var posted = null, postError = null;
  try {
    if (window.opener) {
      window.opener.postMessage({ bg: 'popup-child', ok: true, via: bg.query.via || null,
                                  href: location.href }, '*');
      posted = true;
    } else { posted = false; }
  } catch (e) { postError = String(e && e.name) + ': ' + String(e && e.message); }

  bg.state = function () {
    return { id: bg.id, ready: bg.ready, pass: bg.pass,
             href: location.href, via: bg.query.via || null,
             hasOpener: (function () { try { return !!window.opener; }
                                       catch (e) { return 'unreadable:' + e.name; } })(),
             posted: posted, postError: postError,
             name: window.name, origin: window.origin || location.origin,
             viewport: { w: window.innerWidth, h: window.innerHeight } };
  };
  bg.ping = function () {
    try { window.opener.postMessage({ bg: 'popup-child', ping: Date.now() }, '*'); return true; }
    catch (e) { return String(e && e.name); }
  };

  document.getElementById('meta').textContent =
    'via=' + (bg.query.via || '(none)') + '\nopener=' + bg.state().hasOpener +
    '\nposted=' + posted + '\nhref=' + location.href;
  document.getElementById('closeMe').addEventListener('click', function () { window.close(); });

  bg._status(true);
  bg._ready();
})();
</script>
</html>
