<!-- Terminal-Fenster fixture: form-target
     The landing page for form-submit.html. It re-derives what the query string should have
     been for whichever route was taken and sets its own pass flag, so a harness can assert
     on one boolean instead of string-matching a URL.
     Renders each parameter in large type as well, so the result is readable from a frame.
     Self-contained, file:// safe. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BG · form-target</title>
<style>
/* ---------- shared fixture chrome (identical in every fixture) ---------- */
:root{color-scheme:dark}
html,body{margin:0;padding:0;background:#0b0b0f;color:#e6e6e6;
  font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:none}
#bg-beacon,#bg-status,.bg-corner{position:fixed;width:24px;height:24px;z-index:2147483647}
#bg-beacon{left:0;top:0;background:#ff00ff}
#bg-status{left:24px;top:0;background:#333}
.bg-tr{right:0;top:0;background:#ff8000}
.bg-bl{left:0;bottom:0;background:#0080ff}
.bg-br{right:0;bottom:0;background:#ffff00}
h1{position:fixed;left:56px;top:1px;margin:0;font:600 13px/24px ui-monospace,Menlo,monospace;color:#8a8aff}
#bg-readout{position:fixed;right:8px;bottom:32px;width:380px;max-height:280px;overflow:hidden;
  margin:0;padding:4px;background:rgba(0,0,0,.66);white-space:pre-wrap;word-break:break-all;
  font-size:11px;line-height:1.3;color:#9adcff;pointer-events:none;z-index:2147483646}
/* ---------- fixture-specific ---------- */
#verdict{position:absolute;left:40px;top:120px;width:480px;height:80px;background:#600000;
  font:700 28px/80px ui-monospace,Menlo,monospace;color:#fff;text-align:center}
#verdict.ok{background:#006000}
#params{position:absolute;left:40px;top:220px;font:600 20px/32px ui-monospace,Menlo,monospace}
#params .k{color:#ffd000}
#raw{position:absolute;left:40px;top:520px;width:900px;font-size:12px;color:#8a8a98;
  word-break:break-all}
a{position:absolute;left:40px;top:576px;color:#7fd}
</style>

<body>
<div id="bg-beacon"></div><div id="bg-status"></div>
<div class="bg-corner bg-tr"></div><div class="bg-corner bg-bl"></div><div class="bg-corner bg-br"></div>
<h1>fixture: form-target</h1>
<pre id="bg-readout"></pre>

<div id="verdict">NO PARAMETERS</div>
<div id="params"></div>
<div id="raw"></div>
<a href="form-submit.html">&larr; back to form-submit.html</a>

<script>
/* ---------- shared fixture harness (identical in every fixture except `id`) ---------- */
var __q = new URLSearchParams(location.search);
window.__bg = {
  id: 'form-target', proto: 1, ready: false, pass: null,
  query: Object.fromEntries(__q),
  markers: {beacon:[12,12], status:[36,12], topRight:[-12,12], bottomLeft:[12,-12], bottomRight:[-12,-12]},
  markerColors: {beaconLoading:'#ff00ff', beaconReady:'#00ffff', statusIdle:'#333333',
                 statusPass:'#00ff00', statusFail:'#ff0000',
                 topRight:'#ff8000', bottomLeft:'#0080ff', bottomRight:'#ffff00'},
  expect: {}, state: function(){ return {}; },
  _ready: function(){ this.ready = true;
    document.getElementById('bg-beacon').style.background = '#00ffff';
    document.documentElement.setAttribute('data-bg-ready','1'); this._dump(); },
  _status: function(v){ this.pass = v;
    document.getElementById('bg-status').style.background =
      v === true ? '#00ff00' : v === false ? '#ff0000' : '#333'; },
  _dump: function(){ var el = document.getElementById('bg-readout');
    if (el) el.textContent = JSON.stringify(this.state(), null, 1); }
};
</script>

<script>
(function () {
  var bg = window.__bg;
  var params = bg.query;

  var ROUTES = {
    button: { q: 'terminal-fenster', n: '42', opt: 'b', hidden: 'h1', chk: 'on' },
    enter:  { q: 'entersubmit', via: 'enter' },
    script: { q: 'requestsubmit', via: 'script' }
  };

  bg.expect = {
    routes: ROUTES,
    verdict: { box: [40, 120, 480, 80], centre: [280, 160],
               fail: 'rgb(96, 0, 0)', pass: 'rgb(0, 96, 0)' },
    passWhen: 'the received query string matches exactly one of the three routes'
  };

  function matches(expected) {
    var ek = Object.keys(expected).sort(), gk = Object.keys(params).sort();
    if (ek.length !== gk.length) return false;
    for (var i = 0; i < ek.length; i++) {
      if (ek[i] !== gk[i]) return false;
      if (params[ek[i]] !== expected[ek[i]]) return false;
    }
    return true;
  }

  var route = null;
  for (var name in ROUTES) if (matches(ROUTES[name])) { route = name; break; }

  var v = document.getElementById('verdict');
  if (route) { v.className = 'ok'; v.textContent = 'SUBMIT OK — route: ' + route; }
  else if (Object.keys(params).length) { v.textContent = 'PARAMS PRESENT, NO ROUTE MATCH'; }

  var html = '';
  for (var k in params) {
    html += '<div><span class="k">' + k.replace(/[<&]/g, '') + '</span> = ' +
            String(params[k]).replace(/[<&]/g, '') + '</div>';
  }
  document.getElementById('params').innerHTML = html || '<div>(none)</div>';
  document.getElementById('raw').textContent = location.href;

  bg.state = function () {
    return { id: bg.id, ready: bg.ready, pass: bg.pass,
             route: route, params: params, paramCount: Object.keys(params).length,
             href: location.href, search: location.search,
             referrer: document.referrer || null };
  };

  bg._status(!!route);
  bg._ready();
})();
</script>
</html>
